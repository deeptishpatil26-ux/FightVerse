<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="search.css">
</head>
<body>
    
<section class="fighter-section">
    <h2>SEARCH FIGHTERS</h2>
    <p class="subtitle">Find your favourite MMA fighters</p>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search Islam, Ilia, Jon, Max, Conor..."
        >
        <button id="searchBtn">Search</button>
    </div>

    <p id="message"></p>

    <div class="fighter-container" id="fighterContainer">

        <div class="fighter-card">
            <img src="MAKHACHEV_ISLAM_BELT_01-18.avif" alt="Islam Makhachev">
            <h3>Islam Makhachev</h3>
            <p>Lightweight / Welterweight</p>
        </div>

        <div class="fighter-card">
            <img src="TOPURIA_ILIA_06-28.avif" alt="Ilia Topuria">
            <h3>Ilia Topuria</h3>
            <p>Lightweight / Featherweight</p>
        </div>

        <div class="fighter-card">
            <img src="JONES_JON.avif" alt="Jon Jones">
            <h3>Jon Jones</h3>
            <p>Heavyweight / Light Heavyweight</p>
        </div>

        <div class="fighter-card">
            <img src="HOLLOWAY_MAX_04-13.avif" alt="Max Holloway">
            <h3>Max Holloway</h3>
            <p>Featherweight / Lightweight</p>
        </div>

        <div class="fighter-card">
            <img src="MCGREGOR_CONOR_07-11.avif" alt="Conor McGregor">
            <h3>Conor McGregor</h3>
            <p>Featherweight / Lightweight</p>
        </div>

    </div>
</section>

<script src="search.js"></script>
</body>
</html>
